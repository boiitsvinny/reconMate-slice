services:
  - type: web
    name: reconmate-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: API_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reconmate-postgres
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: SIMULATION_TICK_INTERVAL_SECONDS
        value: "15"

databases:
  - name: reconmate-postgres
    databaseName: reconmate
    user: reconmate
    plan: basic-256mb
    postgresMajorVersion: "16"
