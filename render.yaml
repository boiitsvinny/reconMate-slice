services:
  - type: web
    name: reconmate-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: API_CORS_ORIGINS
        value: https://recon-mate-slice.vercel.app
      - key: API_CORS_ORIGIN_REGEX
        value: '^https://recon-mate-slice-[a-z0-9]+-boiitsvinnys-projects\.vercel\.app$'
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini-2024-07-18
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "12"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: AI_ALLOW_MOCK_FALLBACK
        value: "false"
      - key: SIMULATION_TICK_INTERVAL_SECONDS
        value: "15"
