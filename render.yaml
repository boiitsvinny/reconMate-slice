services:
  - type: web
    name: reconmate-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: API_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: SIMULATION_TICK_INTERVAL_SECONDS
        value: "15"
